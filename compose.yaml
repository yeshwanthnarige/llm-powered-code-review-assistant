services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reviewlens
      POSTGRES_PASSWORD: reviewlens-local
      POSTGRES_DB: reviewlens
    volumes:
      - reviewlens-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewlens -d reviewlens"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://reviewlens:reviewlens-local@db:5432/reviewlens
      REVIEW_PROVIDER: ${REVIEW_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  reviewlens-db:
